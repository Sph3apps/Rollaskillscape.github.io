<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RollaSkillScape - OSRS Skill Game</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #1a1a1a; color: #fff; text-align:center; }
    h1 { margin-top: 50px; }
    select, button { font-size: 16px; padding: 8px 12px; margin: 10px; }
    .skill-display { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:20px; font-size:24px; }
    .skill-icon { width:40px; height:40px; }
    a { color:#4aa; display:block; margin-top:20px; }
  </style>
</head>
<body>
  <h1>OSRS Random Skill Generator</h1>

  <label for="skillType">Choose skill type:</label>
  <select id="skillType">
    <option value="f2p">F2P</option>
    <option value="members">Members</option>
  </select>

  <br>

  <button id="generateBtn">Generate Skill</button>

  <div id="result" class="skill-display"></div>

  <a href="index.html">Back to main page</a>

  <script>
    const skillData = {
      "Attack": "https://oldschool.runescape.wiki/images/Attack_icon_%28detail%29.png?a4903&20220119135436",
      "Strength": "https://oldschool.runescape.wiki/images/Strength_icon_%28detail%29.png?a4903&20220119135436",
      "Defence": "https://oldschool.runescape.wiki/images/Defence_icon_%28detail%29.png?a4903&20220119135436",
      "Ranged": "https://oldschool.runescape.wiki/images/Ranged_icon_%28detail%29.png?a4903&20220119135436",
      "Prayer": "https://oldschool.runescape.wiki/images/Prayer_icon_%28detail%29.png?a4903&20220119135436",
      "Magic": "https://oldschool.runescape.wiki/images/Magic_icon_%28detail%29.png?a4903&20220119135436",
      "Hitpoints": "https://oldschool.runescape.wiki/images/Hitpoints_icon_%28detail%29.png?a4903&20220119135436",
      "Mining": "https://oldschool.runescape.wiki/images/Mining_icon_%28detail%29.png?a4903&20220119135436",
      "Smithing": "https://oldschool.runescape.wiki/images/Smithing_icon_%28detail%29.png?a4903&20220119135436",
      "Fishing": "https://oldschool.runescape.wiki/images/Fishing_icon_%28detail%29.png?a4903&20220119135436",
      "Cooking": "https://oldschool.runescape.wiki/images/Cooking_icon_%28detail%29.png?a4903&20220119135436",
      "Firemaking": "https://oldschool.runescape.wiki/images/Firemaking_icon_%28detail%29.png?a4903&20220119135436",
      "Woodcutting": "https://oldschool.runescape.wiki/images/Woodcutting_icon_%28detail%29.png?a4903&20220119135436",
      "Runecrafting": "https://oldschool.runescape.wiki/images/Runecraft_icon_%28detail%29.png?a4903&20220119135436",
      "Construction": "https://oldschool.runescape.wiki/images/Construction_icon_%28detail%29.png?a4903&20220119135436",
      "Agility": "https://oldschool.runescape.wiki/images/Agility_icon_%28detail%29.png?a4903&20220119135436",
      "Herblore": "https://oldschool.runescape.wiki/images/Herblore_icon_%28detail%29.png?a4903&20220119135436",
      "Thieving": "https://oldschool.runescape.wiki/images/Thieving_icon_%28detail%29.png?a4903&20220119135436",
      "Crafting": "https://oldschool.runescape.wiki/images/Crafting_icon_%28detail%29.png?a4903&20220119135436",
      "Fletching": "https://oldschool.runescape.wiki/images/Fletching_icon_%28detail%29.png?a4903&20220119135436",
      "Slayer": "https://oldschool.runescape.wiki/images/Slayer_icon_%28detail%29.png?a4903&20220119135436",
      "Hunter": "https://oldschool.runescape.wiki/images/Hunter_icon_%28detail%29.png?e2ddc&20220119135437",
      "Farming": "https://oldschool.runescape.wiki/images/Farming_icon_%28detail%29.png?a4903&20220119135436"
    };

    const f2pSkills = ["Attack","Strength","Defence","Ranged","Prayer","Magic","Hitpoints","Mining","Smithing","Fishing","Cooking","Firemaking","Woodcutting"];
    const membersSkills = ["Runecrafting","Construction","Agility","Herblore","Thieving","Crafting","Fletching","Slayer","Hunter","Farming"];

    const resultDiv = document.getElementById("result");
    document.getElementById("generateBtn").addEventListener("click", () => {
      const type = document.getElementById("skillType").value;
      const list = type === "members" ? membersSkills : f2pSkills;
      const skill = list[Math.floor(Math.random() * list.length)];

      resultDiv.innerHTML = `<img class="skill-icon" src="${skillData[skill]}" alt="${skill}"> ${skill}`;
    });
  </script>
</body>
</html>
